[workspace]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "pyarrow-flight.example"
version = "0.1.0"
description = "Reading a Mojo Arrow Flight server from Python with stock pyarrow"
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.12.*"
pyarrow = ">=21"
# pyarrow's conda build splits Flight into its own library. Without this,
# `import pyarrow.flight` fails at the dlopen with "not built with support for
# 'flight'" — which reads like a missing feature rather than a missing package.
libarrow-flight = ">=21"
polars = ">=1"
duckdb = ">=1"
pandas = ">=2"

# Daft is a PyPI-only package. `daft` on conda-forge is a *different project*
# — a library for drawing probabilistic graphical models — so asking conda for
# it installs something unrelated that imports cleanly and then has no
# DataFrame on it.
[pypi-dependencies]
daft = ">=0.7,<0.8"

[tasks]
reference-server = { cmd = "python server/reference_server.py" }

example-basic = { cmd = "python client/01_read_a_table.py" }
example-fanout = { cmd = "python client/02_fan_out.py" }
example-handoff = { cmd = "python client/03_hand_off.py" }
example-errors = { cmd = "python client/04_errors.py" }
# Daft, through the connector in daft_flight/. The in-process source needs a
# Mojo-built shared library and so is not part of `check`; see the README.
example-daft = { cmd = "python client/05_daft_scan.py" }
# What the in-process source pushes into the library, and what it declines to.
# Needs neither a server nor Mojo: the translation is a function.
example-pushdown = { cmd = "python client/06_pushdown.py" }

# What the boundary costs: one column of a real table read in this process and
# over Flight from two servers. Needs a warehouse, iceberg.mojo's scan library
# and (for the third leg) flight.mojo's server, so it is not part of `check`.
transports = { cmd = "bash scripts/transports.sh" }

# Every example against the reference server, which is what CI runs: it proves
# the client code is correct without needing a Mojo toolchain. Pointing the
# same examples at flight.mojo is the manual step the README describes.
check = { cmd = "bash scripts/check.sh" }
